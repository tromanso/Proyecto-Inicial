{% extends "base.html" %}
{% block title %}Crear cuenta · FitApp{% endblock %}
{% block content %}
<section class="form-page">
    <a class="back-link" href="{% url 'login' %}">← Volver a iniciar sesión</a>
    <div class="form-panel form-panel-wide">
        <p class="eyebrow">PASO 1 DE 2 · TU PERFIL</p>
        <h1>Crear cuenta</h1>
        <p class="muted">Cuéntanos un poco de ti para preparar tu espacio.</p>
        <form method="post" class="form-grid">
            {% csrf_token %}
            <div class="field field-span">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" autocomplete="email" value="{{ email|default:'' }}" required>
            </div>
            <div class="field field-span">
                <label for="password">Contraseña <span class="hint">(mínimo 8 caracteres)</span></label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="field">
                <label for="weight">Peso (kg)</label>
                <input id="weight" name="weight" type="number" min="25" max="300" step="0.1" value="{{ weight|default:'' }}" required>
            </div>
            <div class="field">
                <label for="height">Altura (cm)</label>
                <input id="height" name="height" type="number" min="100" max="250" step="0.1" value="{{ height|default:'' }}" required>
            </div>
            <div class="field field-span">
                <label for="budget">¿Qué presupuesto prefieres para tus alimentos?</label>
                <select id="budget" name="budget" required>
                    <option value="">Selecciona una opción</option>
                    <option value="barato" {% if budget == "barato" %}selected{% endif %}>Barato</option>
                    <option value="economico" {% if budget == "economico" %}selected{% endif %}>Económico</option>
                    <option value="caro" {% if budget == "caro" %}selected{% endif %}>Caro</option>
                </select>
            </div>
            <div class="field field-span">
                <button class="button button-primary button-full" type="submit">Continuar con mi actividad</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
